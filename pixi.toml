[workspace]
name = "standard-patrol-events"
channels = [
    "file:///tmp/ecoscope-workflows-custom/release/artifacts/",
    'https://repo.prefix.dev/ecoscope-workflows/',
    'conda-forge',
    'https://repo.prefix.dev/ecoscope-workflows-custom/',
]
platforms = ['linux-64', 'osx-arm64', 'win-64']

[dependencies]
rattler-build = "*"
yq = "*"
hatch = "*"
pip = "*"
hatch-vcs = "*"
wt-compiler = "==0.10.2"
graphviz = "*"

# Local-channel "*" pins are for development only; pin both before publishing.
[feature.compile.dependencies]
ecoscope-workflows-ext-standard-patrol-events = "*"
ecoscope-workflows-ext-custom = "*"
graphviz = "*"
wt-compiler = "==0.10.2"

[environments]
compile = { features = [
    "compile",
], solve-group = "compile", no-default-feature = true }

[tasks]
[tasks.build-release]
cmd = './publish/build.sh'

[tasks.pytest-310]
cmd = './dev/pytest-task.sh 310'

[tasks.pytest-311]
cmd = './dev/pytest-task.sh 311'

[tasks.pytest-312]
cmd = './dev/pytest-task.sh 312'
