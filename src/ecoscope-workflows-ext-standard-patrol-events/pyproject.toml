[project]
name = "ecoscope-workflows-ext-standard-patrol-events"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Partner profiles and templates for the standard patrol & events report."
readme = "README.md"
classifiers = [
    "Development Status :: 1 - Planning",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
license = { text = "BSD-3-Clause" }
[project.entry-points."wt_registry"]
tasks = "ecoscope_workflows_ext_standard_patrol_events.tasks"


[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["ecoscope_workflows_ext_standard_patrol_events"]
exclude = ["vendor"]
only-packages = true
[tool.hatch.build.targets.sdist]
include = ["ecoscope_workflows_ext_standard_patrol_events"]
exclude = ["vendor"]
[tool.hatch.build.hooks.vcs]
version-file = "ecoscope_workflows_ext_standard_patrol_events/_version.py"
[tool.hatch.version]
source = "vcs"
fallback-version = "9999"
[tool.hatch.version.raw-options]
root = "../.."


[tool.pixi.workspace]
channels = [
    "https://prefix.dev/ecoscope-workflows-custom",
    "https://prefix.dev/ecoscope-workflows",
    "conda-forge",
]
platforms = ["linux-64", "osx-arm64", "win-64", "osx-64"]
channel-priority = "disabled"

[tool.pixi.pypi-dependencies]
ecoscope-workflows-ext-standard-patrol-events = { path = ".", editable = true }

[tool.pixi.dependencies]
# minimal runtime deps: the data package must not depend on ext-custom
wt-registry = ">=0.2.0,<0.3.0"
pydantic = ">=2"
pyyaml = "*"

[tool.mypy]
plugins = ["pydantic.mypy"]
[tool.pixi.feature.mypy]
dependencies = { mypy = "*" }
tasks = { mypy = "mypy --package ecoscope_workflows_ext_standard_patrol_events --package tests --no-incremental" }

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.environments]
default = { solve-group = "default" }

mypy-py310 = { features = ["test", "py310", "mypy"], solve-group = "py310" }
mypy-py311 = { features = ["test", "py311", "mypy"], solve-group = "py311" }
mypy-py312 = { features = ["test", "py312", "mypy"], solve-group = "py312" }

test-py310 = { features = ["test", "py310"], solve-group = "py310" }
test-py311 = { features = ["test", "py311"], solve-group = "py311" }
test-py312 = { features = ["test", "py312"], solve-group = "py312" }
