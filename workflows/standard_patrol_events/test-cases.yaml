# One case per site; `make run PARTNER=<case>` runs a case against live EarthRanger.
costaecuador:
  name: costaecuador
  description: Costa Ecuador, Aug-Oct 2026, grouped by team (community).
  params:
    workflow_details:
      name: Reporte de patrullajes y eventos
      description: Costa Ecuador
    er_client:
      data_source:
        name: costaecuador
    time_range:
      since: '2026-08-01T00:00:00'
      until: '2026-11-01T00:00:00'
      timezone:
        label: America/Guayaquil
        tzCode: America/Guayaquil
        name: (UTC-05:00) America/Guayaquil
        utc: -05:00
    base_maps: {}
    patrol_params:
      patrol_types: []
    effort_grouper:
      var: patrol_team_name
    effort_metrics:
      metrics:
        - metric: patrol_count
        - metric: total_distance
          unit: km
        - metric: total_duration
          unit: h
    labels:
      language: es
    event_types:
      vars: []
    patrol_serial:
      var: ""
    tracks_color_by:
      var: patrol_type
    teams:
      vars: []
    leader_group:
      group: ""
    retrieved_events:
      retrieval: all_in_period
    state_events:
      states: []
    event_grouping:
      var: event_type_display
    detail_mode:
      var: general
    event_detail_tables:
      detail_fields: {}
    images_options:
      skip_download: false
      max_images: 12
    report_blocks: {}
    template_path:
      template: standard
    report_title:
      var: Reporte de patrullajes y eventos
    report_subtitle:
      var: Costa Ecuador
    detail_intro:
      var: ''
