# One case per site; `make run PARTNER=<case>` runs a case against live EarthRanger.
costaecuador:
  name: costaecuador
  description: Costa Ecuador, Aug-Oct 2026, grouped by team (community).
  params:
    workflow_details:
      name: Reporte de patrullajes y eventos
      description: Costa Ecuador
    er_client:
      data_source:
        name: costaecuador
    time_range:
      since: '2026-08-01T00:00:00'
      until: '2026-11-01T00:00:00'
      timezone:
        label: America/Guayaquil
        tzCode: America/Guayaquil
        name: (UTC-05:00) America/Guayaquil
        utc: -05:00
    base_maps: {}
    area_scope:
      level: site
      unit: null
    patrol_params:
      patrol_types: []
    team_groups:
      vars:
      - PONGALILLO
      - BELLAVISTA
      - COSTA RICA
      - EL CONCHAL
      - PUERTO ROMA
    effort_grouper:
      var: team
    labels:
      language: es
    period_events:
      event_types: []
    retrieved_events:
      retrieval: all_in_period
    state_events:
      state: all
    event_grouping:
      var: event_type_display
    detail_mode:
      var: general
    event_detail_tables:
      detail_fields: {}
    images_options:
      mode: attachments
      max_images: 12
    report_blocks: {}
    template_path:
      template: standard
    report_title:
      var: Reporte de patrullajes y eventos
    report_subtitle:
      var: Costa Ecuador
    report_area:
      var: Golfo de Guayaquil
    detail_intro:
      var: ''
