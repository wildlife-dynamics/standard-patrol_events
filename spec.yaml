id: standard_patrol_events

# Standard Patrol & Events (MRD-2): one workflow for any site. Every difference between
# sites is a form parameter; labels, logos and wording live in the report template.
# Outputs: a dashboard (interactive) and a Word report, both fed by the same tasks.

requirements:
  - name: ecoscope-platform
    version: "==2.39.1"
    channel: https://repo.prefix.dev/ecoscope-workflows/
  - name: ecoscope-workflows-ext-standard-patrol-events
    version: "==0.0.4"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/
  - name: pydeck
    version: 0.9.2
    channel: conda-forge

# The form as approved in docs/superpowers/specs/2026-11-19-config-form-checkbox.rjsf.json
# (tests/test_form.py checks it). Fields shown by a tick or choice live in the section if/then/allOf.
# grouping option values stay the column names the workflow reads (patrol_team_name, *_display).
rjsf-overrides:
  properties:
    patrol_filter.description: 'Optional: limit the patrols to one team, team leader or patrol. Leave unticked to
      include all patrols.'
    patrol_filter.additionalProperties: true
    patrol_filter.properties: {}
    patrol_filter.allOf:
    - if:
        anyOf:
        - properties:
            team:
              const: true
          required:
          - team
        - properties:
            team_leader:
              const: true
          required:
          - team_leader
      else:
        properties:
          single_patrol:
            title: Single Patrol
            type: boolean
            default: false
    - if:
        anyOf:
        - properties:
            single_patrol:
              const: true
          required:
          - single_patrol
        - properties:
            team_leader:
              const: true
          required:
          - team_leader
      else:
        properties:
          team:
            title: Team
            type: boolean
            default: false
    - if:
        anyOf:
        - properties:
            single_patrol:
              const: true
          required:
          - single_patrol
        - properties:
            team:
              const: true
          required:
          - team
      else:
        properties:
          team_leader:
            title: Team Leader
            type: boolean
            default: false
    - if:
        properties:
          single_patrol:
            const: true
        required:
        - single_patrol
      then:
        properties:
          patrol_id:
            title: Patrol ID
            type: string
            description: The patrol to analyze, matched against its serial number (the ID shown in EarthRanger).
        required:
        - patrol_id
    - if:
        properties:
          team:
            const: true
        required:
        - team
      then:
        properties:
          teams:
            title: ' '
            type: array
            minItems: 1
            items:
              type: string
            description: Team names as set in EarthRanger's patrol configuration.
    - if:
        properties:
          team_leader:
            const: true
        required:
        - team_leader
      then:
        properties:
          leaders:
            title: ' '
            type: array
            minItems: 1
            items:
              type: string
            description: Leader names as in EarthRanger.
    patrol_type.properties.vars:
      title: ' '
      type: array
      uniqueItems: true
      default: []
      description: Choose the patrol types to include. Leave it empty to include all of them.
      items:
        type: string
      ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: patrol_type
          depends_on: properties.er_client.properties.data_source.properties.name
    patrol_effort.description: Choose how the patrol effort table is grouped and which columns it shows.
    patrol_effort.additionalProperties: true
    patrol_effort.properties:
      group_by:
        title: Group By
        type: string
        default: patrol_type
        oneOf:
        - const: patrol_type
          title: Patrol Type
        - const: team
          title: Team
        - const: leader
          title: Leader
        - const: patrol
          title: Individual Patrol
        - const: area
          title: Area (Map Layer)
      columns:
        title: Columns
        type: array
        uniqueItems: true
        description: Columns of the patrol effort table.
        default:
        - patrol_count
        - total_distance
        - total_duration
        items:
          type: string
          oneOf:
          - const: patrol_count
            title: Patrols
          - const: total_distance
            title: Distance (km)
          - const: total_duration
            title: Hours
          - const: patrol_days
            title: Days With Patrols
          - const: leg_count
            title: Legs
          - const: member_days
            title: Person-Days
          - const: area_covered_merged
            title: Area Covered (km²)
    patrol_effort.if:
      properties:
        group_by:
          const: area
      required:
      - group_by
    patrol_effort.then:
      properties:
        map_layer:
          title: Map Layer
          type: string
          description: Spatial feature group whose areas (e.g. regions, sectors) become the rows of the table.
          ecoscope:transform:
          - transformer: EarthRangerEnumResolver
            transformer_kws:
              type: spatial_feature_group
              depends_on: properties.er_client.properties.data_source.properties.name
      required:
      - map_layer
    patrol_grouping.description: Choose how patrol tracks are coloured on the map. Tracks without a team use their
      leader's name.
    patrol_grouping.properties.var:
      title: ' '
      type: string
      default: patrol_type
      oneOf:
      - const: patrol_type
        title: Patrol Type
      - const: patrol_team_name
        title: Team
    event_scope.description: Choose which events to include.
    event_type.properties.vars:
      title: ' '
      type: array
      uniqueItems: true
      default: []
      items:
        type: string
      description: Choose the event types to include. Leave it empty to include all of them.
      ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: event_type
          depends_on: properties.er_client.properties.data_source.properties.name
    state_events.description: Choose to analyze events with a certain state. If left empty, events of all states
      will be analyzed
    state_events.properties.states:
      title: ' '
      type: array
      uniqueItems: true
      default: []
      items:
        type: string
        oneOf:
        - const: new
          title: New
        - const: active
          title: Active
        - const: resolved
          title: Resolved
        - const: review
          title: Review
    event_grouping.description: Choose how events are grouped in the tables, charts and map colours.
    event_grouping.properties.var:
      title: ' '
      type: string
      default: event_type_display
      oneOf:
      - const: event_type_display
        title: Event Type
      - const: event_category_display
        title: Event Category
    event_details_settings.additionalProperties: true
    event_details_settings.properties:
      all_details:
        title: Show all fields
        type: boolean
        default: true
        description: When ticked, every event is shown with all its details. Untick to choose the fields for each
          event type.
    event_details_settings.if:
      properties:
        all_details:
          const: false
      required:
      - all_details
    event_details_settings.then:
      properties:
        tables:
          title: ' '
          type: array
          default: []
          description: Add an event type and choose the fields to show for it. Event types you don't add show their
            first 3 fields.
          items:
            type: object
            title: ' '
            additionalProperties: false
            properties:
              event_type:
                title: Event Type
                type: string
                ecoscope:transform:
                - transformer: EarthRangerEnumResolver
                  transformer_kws:
                    type: event_type
                    depends_on: properties.er_client.properties.data_source.properties.name
              fields:
                title: Fields
                type: array
                items:
                  type: string
                description: Field names as on the event form, one per line.
            required:
            - event_type
    report_text.description: Name the report, choose its language and pick what it includes.
    report_text.properties.language:
      title: Language
      description: Choose the language for the report's headings and labels.
      type: string
      default: en
      oneOf:
      - const: en
        title: English
      - const: es
        title: Español
      - const: pt
        title: Português
    report_text.properties.sections.uniqueItems: true
    report_text.properties.sections.items:
      type: string
      oneOf:
      - const: headline_stats
        title: Headline Figures
      - const: personnel
        title: Personnel
      - const: time_density
        title: Patrol Time Density Map
      - const: event_density
        title: Event Density Map
      - const: events_chart
        title: Events Chart
      - const: monthly_chart
        title: Events by Month
      - const: category_priority
        title: Events by Category and Priority
      - const: conclusions
        title: Conclusions Box
  uiSchema:
    ui:order:
    - workflow_details
    - er_client
    - time_range
    - base_maps
    - patrol_filter
    - patrol_type
    - patrol_effort
    - patrol_grouping
    - event_scope
    - event_type
    - state_events
    - event_grouping
    - event_details_settings
    - report_text
    - download_attachments
    - '*'
    patrol_grouping.var:
      ui:options:
        label: false
    event_grouping.var:
      ui:options:
        label: false
    event_details_settings.tables:
      items:
        ui:options:
          label: false
    report_text:
      ui:order: [title, subtitle, language, sections, details_intro]
      title:
        ui:placeholder: Patrol & Events Report
      subtitle:
        ui:placeholder: e.g. Parque Nacional Los Alerces
      details_intro:
        ui:widget: textarea
        ui:placeholder: e.g. Events recorded by rangers during the period.
    # additionalProperties is true there for the if/then fields: hide RJSF's "+" button, and the
    # values a hidden field leaves behind (else RJSF shows them as editable "<name> Key" rows)
    patrol_filter.ui:options.expandable: false
    patrol_filter.additionalProperties.ui:widget: hidden
    patrol_effort.ui:options.expandable: false
    patrol_effort.additionalProperties.ui:widget: hidden
    event_details_settings.ui:options.expandable: false
    event_details_settings.additionalProperties.ui:widget: hidden

  # Form-root show/hide (design §3, §5): Patrol Type, Patrol Effort, Events and Event Type disappear for a
  # Single Patrol. Nested on purpose: RJSF ignores sibling root rules and rules inside a root allOf.
  # Applied after every compile by dev/add_root_rules.py until wt-compiler emits root rules
